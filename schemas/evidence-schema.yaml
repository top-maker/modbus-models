$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:modbus-models:evidence:l2:1
type: object
additionalProperties: false
required:
- schema-version
- level
- status
- model
- scenario
- profile
- tools
- covered
- excluded
- checks
- executed-at
- executor
- run-url
- test-revision
- td
- limitations
properties:
  schema-version:
    const: '1'
  level:
    const: L2
  status:
    enum:
    - passed
    - partial
    - failed
    - not-tested
  profile:
    const: '0.2'
  model:
    type: object
    additionalProperties: false
    required:
    - path
    - sha256
    properties:
      path:
        type: string
        pattern: ^\.\./[a-z0-9-]+\.tm\.json$
      sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
  scenario:
    type: object
    additionalProperties: false
    required:
    - path
    - sha256
    properties:
      path:
        type: string
        pattern: ^\.\./simulation/[a-z0-9-]+\.sim\.json$
      sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
  tools:
    type: object
    minProperties: 3
    additionalProperties:
      type: string
      minLength: 1
  covered:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
  excluded:
    type: array
    items:
      type: string
      minLength: 1
  checks:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - scope
      - status
      - method
      - expected
      - actual
      properties:
        scope:
          type: string
          minLength: 1
        status:
          enum:
          - passed
          - failed
          - not-tested
        method:
          type: string
          minLength: 1
        expected: {}
        actual: {}
  executed-at:
    type: string
    format: date-time
  executor:
    type: string
    minLength: 1
  run-url:
    type: string
    pattern: ^https://github\.com/[^/]+/[^/]+/actions/runs/[0-9]+$
  test-revision:
    type: string
    pattern: ^[0-9a-f]{40}$
  td:
    type: object
    additionalProperties: false
    required:
    - sha256
    - host
    - port
    - unit-id
    - target
    properties:
      sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
      host:
        const: 127.0.0.1
      port:
        type: integer
        minimum: 1024
        maximum: 65535
      unit-id:
        const: 1
      target:
        const: node-wot-0.9.2
  limitations:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
